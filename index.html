<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Contigo, paso a paso · Seguros Alfa</title>
<meta name="description" content="Prototipo de la ruta digital de reclamaciones por sismo. Documento de trabajo, no aprobado para clientes.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --verde-oscuro:#005D55;--verde:#009B76;--limon:#7AB800;--amarillo:#FECB00;--azul:#004953;
  --tinte:#F2F8F6;--linea:#DCE9E5;--tinta:#12302F;--gris:#5E7373;
  --sombra:0 1px 2px rgba(0,73,83,.05),0 10px 30px rgba(0,73,83,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  background:#0C2A2A;color:var(--tinta);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column;align-items:center}
@media(min-width:760px){body{padding:24px 16px 44px;background:linear-gradient(160deg,#08312D,#04222A)}}

/* barra del prototipo */
#demo{width:100%;max-width:430px;background:#FFFBEC;border:1px solid #F2DFA0;border-radius:14px;
  padding:13px 15px;margin-bottom:14px;font-size:12.5px;color:#5A4A00;line-height:1.5}
#demo b{color:#3D3200}
#demo .perfiles{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
#demo button{flex:1 1 auto;border:1px solid #E4CE7E;background:#fff;border-radius:99px;padding:8px 10px;
  font-size:11.5px;font-weight:600;color:#6B5500;font-family:inherit;cursor:pointer}
#demo button.on{background:var(--verde-oscuro);color:#fff;border-color:var(--verde-oscuro)}
@media(max-width:759px){#demo{border-radius:0;border-left:0;border-right:0;border-top:0;margin:0}}

.marco{width:100%;max-width:430px;background:#fff;overflow:hidden;display:flex;flex-direction:column;flex:1;min-height:0}
@media(min-width:760px){.marco{border-radius:30px;box-shadow:0 30px 80px rgba(0,0,0,.42);min-height:750px;flex:none}}

header.app{background:var(--verde-oscuro);color:#fff;padding:15px 20px 18px}
header.app .fila{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;gap:12px}
header.app img.logo{height:21px;width:auto;display:block}
.ayuda-btn{background:rgba(255,255,255,.15);border:0;color:#fff;font-family:inherit;font-size:12px;
  font-weight:500;padding:7px 13px;border-radius:99px;cursor:pointer;flex:0 0 auto}
header.app h1{font-size:20px;font-weight:600;margin:0;line-height:1.26;letter-spacing:-.4px}
header.app .mini{font-size:10.5px;opacity:.72;letter-spacing:.6px;margin-bottom:4px;font-weight:500}
.progreso{height:3px;background:rgba(255,255,255,.2);border-radius:99px;margin-top:14px;overflow:hidden}
.progreso i{display:block;height:100%;background:var(--amarillo);width:0;transition:width .45s ease}

main.app{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;background:#fff}
p.tx{margin:0;font-size:14.5px;color:#38504F;line-height:1.6}
p.tx.small{font-size:12.5px;color:var(--gris)}
h2.sec{font-size:14px;font-weight:600;color:var(--azul);margin:4px 0 -4px}

.opt{border:1.5px solid var(--linea);border-radius:14px;padding:14px 15px;cursor:pointer;display:flex;
  justify-content:space-between;align-items:center;gap:10px;background:#fff;font-family:inherit;
  text-align:left;width:100%;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--verde)}
.opt.on{border-color:var(--verde);background:#F0F9F6}
.opt strong{font-size:14.5px;font-weight:600;color:var(--azul);display:block}
.opt small{font-size:12px;color:var(--gris);display:block;margin-top:2px;line-height:1.4}
.opt .rad{flex:0 0 auto;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--linea)}
.opt.on .rad{border-color:var(--verde);background:var(--verde);box-shadow:inset 0 0 0 3px #fff}

.caja{border:1px solid var(--linea);border-radius:14px;padding:14px;background:#FAFDFC;font-size:13px;
  color:#4A6260;line-height:1.55}
.caja b.t{display:block;color:var(--azul);font-size:13.5px;margin-bottom:6px;font-weight:600}
.caja strong{color:var(--azul);font-weight:600}
.caja.aviso{background:#FFFBEC;border-color:#F2DFA0;color:#5A4A00}
.caja.aviso b.t{color:#3D3200}
.seg{background:#F0F9F6;border-radius:12px;padding:11px 12px;font-size:12px;color:var(--verde-oscuro);
  display:flex;gap:8px;line-height:1.45}

.item{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--linea)}
.item:last-of-type{border-bottom:0}
.item .bx{flex:0 0 auto;width:20px;height:20px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-size:11px;color:#fff;background:var(--limon);margin-top:2px}
.item .bx.pend{background:#fff;border:1.5px solid var(--amarillo);color:#B08900}
.item .tx b{display:block;font-size:13.8px;color:var(--azul);font-weight:600}
.item .tx small{display:block;font-size:11.5px;color:var(--gris);line-height:1.4}

.subir{border:1.5px dashed var(--verde);border-radius:14px;padding:18px 14px;text-align:center;
  cursor:pointer;background:#F7FCFA;display:block}
.subir b{display:block;color:var(--azul);font-size:14px;margin-bottom:4px}
.subir small{font-size:12px;color:var(--gris);line-height:1.45;display:block}
input[type=file]{display:none}
.prev{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--azul);background:#F6FBEE;
  border-radius:11px;padding:9px 11px}
.prev img{width:34px;height:34px;object-fit:cover;border-radius:7px;flex:0 0 auto}
.prev .quitar{margin-left:auto;color:#96341F;font-size:11.5px;cursor:pointer;background:none;border:0;
  font-family:inherit;flex:0 0 auto}

.campo{width:100%;border:1.5px solid var(--linea);border-radius:12px;padding:13px 14px;font-size:15px;
  font-family:inherit;color:var(--azul);background:#fff}
.campo:focus{outline:0;border-color:var(--verde)}
label.lb{font-size:12.5px;font-weight:600;color:var(--azul);display:block;margin-bottom:5px}

.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#38504F;line-height:1.45;
  cursor:pointer;padding:3px 0}
.chk .bx2{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--linea);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;margin-top:1px}
.chk.on .bx2{background:var(--verde);border-color:var(--verde)}

#firma{border:1.5px solid var(--linea);border-radius:14px;width:100%;height:130px;background:#FCFEFD;
  touch-action:none;display:block}
.firma-pie{display:flex;justify-content:space-between;font-size:11.5px;color:var(--gris);margin-top:-6px}
.firma-pie button{background:none;border:0;color:var(--verde);font-family:inherit;font-size:11.5px;
  font-weight:600;cursor:pointer;padding:0}

.exito{width:64px;height:64px;border-radius:50%;background:#EAF6DC;color:#5A8C0A;font-size:30px;
  display:flex;align-items:center;justify-content:center;margin:6px auto 0}

.lt{display:flex;gap:11px}
.lt .col{flex:0 0 auto;width:16px;display:flex;flex-direction:column;align-items:center;padding-top:4px}
.lt .pt{width:11px;height:11px;border-radius:50%;background:var(--limon);flex:0 0 auto}
.lt .pt.now{background:var(--verde);box-shadow:0 0 0 4px rgba(0,155,118,.18)}
.lt .pt.next{background:#fff;border:1.5px solid var(--linea)}
.lt .vr{flex:1;width:2px;background:var(--linea);margin:4px 0;min-height:16px}
.lt .tx{font-size:13px;color:#4A6260;padding-bottom:16px;line-height:1.45}
.lt .tx b{display:block;color:var(--azul);font-size:13.8px}
.lt .tx small{color:#93A3A3;font-size:11.5px;display:block}

/* mensaje de WhatsApp */
.wa-top{background:#075E54;color:#fff;padding:11px 15px;display:flex;align-items:center;gap:10px}
.wa-av{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;
  justify-content:center;flex:0 0 auto;overflow:hidden;padding:6px}
.wa-av img{width:100%;height:auto}
.wa-av img{width:100%;height:auto;display:block}
.wa-nom{font-size:13.5px;font-weight:600;line-height:1.2}
.wa-ver{font-size:10px;opacity:.85}
.wa-body{background:#ECE5DD;flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:9px}
.wa-msg{background:#fff;border-radius:10px 10px 10px 3px;padding:11px 13px;font-size:13px;line-height:1.55;
  color:#14261F;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.wa-msg .enlace{color:#0A6EBD;word-break:break-all}
.wa-hora{font-size:9.5px;color:#93A3A3;text-align:right;margin-top:5px}
.wa-btn{background:#fff;border-radius:10px;padding:12px;text-align:center;font-size:13.5px;color:#0A6EBD;
  font-weight:600;box-shadow:0 1px 1px rgba(0,0,0,.08);cursor:pointer;border:0;width:100%;font-family:inherit}

footer.app{padding:14px 20px 18px;border-top:1px solid var(--linea);background:#fff;display:flex;
  flex-direction:column;gap:9px}
.cta{background:var(--verde);color:#fff;border:0;border-radius:99px;padding:15px;font-size:15px;
  font-weight:600;font-family:inherit;cursor:pointer;width:100%}
.cta:disabled{background:#CFE3DE;cursor:not-allowed}
.cta.sec{background:#fff;color:var(--verde-oscuro);border:1.5px solid var(--linea)}
.cta.link{background:none;border:0;color:var(--gris);font-size:12.5px;font-weight:500;padding:0}

#hoja{position:fixed;inset:0;background:rgba(4,34,42,.6);display:none;align-items:flex-end;
  justify-content:center;z-index:90}
#hoja.on{display:flex}
#hoja .panel{background:#fff;width:100%;max-width:430px;max-height:82vh;overflow-y:auto;
  border-radius:22px 22px 0 0;padding:22px}
@media(min-width:760px){#hoja{align-items:center}#hoja .panel{border-radius:22px;max-height:78vh}}
#hoja h3{margin:0 0 4px;font-size:17px;color:var(--azul)}
#hoja .sub{font-size:12.5px;color:var(--gris);margin:0 0 14px}
#hoja img.logo-g{height:20px;width:auto;display:block;margin-bottom:14px}
.traza{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:#0C2A2A;
  color:#9FE0CE;border-radius:12px;padding:14px;overflow-x:auto;white-space:pre;line-height:1.6}
</style>
</head>
<body>

<div id="demo">
  <b>Prototipo para revisión.</b> El cliente entra directo desde el enlace que recibe, sin códigos ni contraseñas. La cámara, la firma y el registro de trazabilidad funcionan de verdad. Datos ficticios; nada se envía a ningún servidor.
  <div class="perfiles">
    <button data-p="0" class="on">Documentos completos</button>
    <button data-p="1">Con pendientes</button>
    <button data-p="2">Daño mayor</button>
  </div>
</div>

<div class="marco">
  <header class="app">
    <div class="fila">
      <img class="logo" id="logo-header" alt="Seguros Alfa">
      <button class="ayuda-btn" onclick="ayuda()">Necesito ayuda</button>
    </div>
    <div class="mini" id="h-mini"></div>
    <h1 id="h-tit"></h1>
    <div class="progreso"><i id="h-prog"></i></div>
  </header>
  <main class="app" id="cuerpo"></main>
  <footer class="app" id="pie"></footer>
</div>

<div id="hoja" onclick="if(event.target.id==='hoja')cerrarHoja()"><div class="panel" id="panel"></div></div>

function pintar(){
  const p = PANTALLAS[S.pantalla]();
  const cab = document.querySelector('header.app');
  h('h-mini').style.display = p.oculto ? 'none' : 'block';
  h('h-tit').style.display  = p.oculto ? 'none' : 'block';
  document.querySelector('.progreso').style.display = p.oculto ? 'none' : 'block';
  document.querySelector('header.app').style.padding = p.oculto ? '15px 20px 13px' : '15px 20px 18px';
  document.querySelector('header.app .fila').style.marginBottom = p.oculto ? '0' : '13px';
  h('h-mini').textContent = p.mini || '';
  h('h-tit').innerHTML = p.tit || '';
  h('h-prog').style.width = (p.prog || 0) + '%';
  h('cuerpo').innerHTML = p.cuerpo;
  h('pie').innerHTML = p.pie;
  h('pie').style.display = p.pie ? 'flex' : 'none';
  h('cuerpo').scrollTop = 0;
  if (S.pantalla === 'firma') prepararFirma();
}
function ir(p){ S.pantalla = p; reg('pantalla', { nombre:p }); pintar(); }
function entrar(){
  reg('enlace_abierto', { vigencia_horas:72, uso:'primero', autenticacion:'enlace_personal' });
  ir('resumen');
}
function setValor(v){ S.valor = v; pintar(); }
function clasificar(){
  const mapa = { menor:'ruta_agil', mayor:'evaluacion_especializada', nose:'sin_valor_estimado' };
  reg('clasificacion', { respuesta:S.valor, tipificacion:mapa[S.valor], umbral:'15.000.000' });
  ir(S.valor==='menor' ? 'agil' : S.valor==='mayor' ? 'especializada' : 'estimar');
}
function cargar(k, input){
  const f = input.files[0]; if (!f) return;
  if (f.size < 12000){
    reg('documento_rechazado', { tipo:k, motivo:'archivo_muy_pequeno' });
    alert('No alcanzamos a leer bien este documento. Intente de nuevo con más luz y apoyando el papel sobre una superficie plana.');
    input.value = ''; return;
  }
  const url = f.type.startsWith('image') ? URL.createObjectURL(f) : svgPdf();
  S.cargados[k] = { nombre:f.name, url };
  reg('documento_cargado', { tipo:k, archivo:f.name, peso_kb:Math.round(f.size/1024), legibilidad:'ok' });
  pintar();
}
const svgPdf = () => 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"%3E%3Crect width="40" height="40" fill="%23005D55"/%3E%3Ctext x="20" y="25" font-size="11" fill="white" text-anchor="middle"%3EPDF%3C/text%3E%3C/svg%3E';
function quitar(k){ delete S.cargados[k]; reg('documento_retirado', { tipo:k }); pintar(); }
function marcar(i){ S.casillas[i] = !S.casillas[i]; pintar(); }

let ctx, dibujando = false, hayTrazo = false, lienzo;
function prepararFirma(){
  lienzo = h('firma');
  const r = lienzo.getBoundingClientRect();
  lienzo.width = r.width * 2; lienzo.height = r.height * 2;
  ctx = lienzo.getContext('2d'); ctx.scale(2, 2);
  ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#004953';
  hayTrazo = false;
  const pos = e => { const b = lienzo.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e;
    return [t.clientX - b.left, t.clientY - b.top]; };
  const ini = e => { e.preventDefault(); dibujando = true; ctx.beginPath(); ctx.moveTo(...pos(e)); };
  const mov = e => { if (!dibujando) return; e.preventDefault(); ctx.lineTo(...pos(e)); ctx.stroke();
    hayTrazo = true; revisar(); };
  const fin = () => { dibujando = false; };
  lienzo.addEventListener('mousedown', ini); lienzo.addEventListener('mousemove', mov);
  window.addEventListener('mouseup', fin);
  lienzo.addEventListener('touchstart', ini, { passive:false });
  lienzo.addEventListener('touchmove', mov, { passive:false });
  lienzo.addEventListener('touchend', fin);
  revisar();
}
function revisar(){
  const b = h('btn-firma'); if (!b) return;
  const ok = hayTrazo && S.casillas.every(Boolean);
  b.disabled = !ok;
  if (ok && !S.firmado){
    S.firmado = true;
    reg('finiquito_firmado', { mecanismo:'firma_electronica_simple',
      hash_documento:'sha256:' + Math.random().toString(16).slice(2,18) + '…',
      ip:'190.14.xxx.xxx', casillas_aceptadas:3 });
  }
}
function limpiarFirma(){ ctx.clearRect(0,0,lienzo.width,lienzo.height); hayTrazo = false; revisar(); }
function valBanco(){ const b = h('btn-banco'); if (!b) return;
  b.disabled = !(S.banco && S.tipo && S.cuenta.length >= 6); }
function radicar(){
  S.constancia = 'RAD-' + S.perfil.radicado.replace('INC-','') + '-' + new Date().getDate();
  reg('datos_bancarios', { banco:S.banco, tipo:S.tipo,
    cuenta_enmascarada:'••••' + S.cuenta.slice(-4), titularidad:'coincide', cuenta_repetida:false });
  reg('radicacion_completa', { constancia:S.constancia, estado:'documentacion_radicada' });
  reg('mensaje_enviado', { canal:'whatsapp', plantilla:'confirmacion_radicacion_v1' });
  ir('listo');
}

    <button class="cta sec" onclick="cerrarHoja()">Volver</button>`);
}
function pedir(canal){
  reg('escalamiento', { motivo:'solicitud_del_cliente', canal, pantalla:S.pantalla });
  abrirHoja(`<div class="exito">✓</div>
    <h3 style="text-align:center">Listo</h3>
    <p class="sub" style="text-align:center">Un asesor lo contactará por ${canal} hoy antes de las 6:00 p.m. Verá en pantalla lo mismo que usted, así que no tendrá que repetir nada.</p>
    <button class="cta" onclick="cerrarHoja()">Volver a mi caso</button>`);
}
